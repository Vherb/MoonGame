server {
    server_name moongame.atspace.cc;

    root /var/www/moongame.atspace.cc;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No cache for service worker and index.html
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache hashed static assets long-term
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API routes -> Node backend on port 6000 (pass through as-is, server has mixed /api/* and /* routes)
    location /api/ {
        proxy_pass http://127.0.0.1:6000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pure API backend routes (all API calls go through /api/ prefix in production)
    location ~ ^/(me|ping|health|balance|sc|resources|jackpot|wallet|fund|rates|config|house)(/|$) {
        proxy_pass http://127.0.0.1:6000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass http://127.0.0.1:6000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/moongame.atspace.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moongame.atspace.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = moongame.atspace.cc) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name moongame.atspace.cc;
    return 404;
}
